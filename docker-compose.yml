services:
  # FastAPI Web App & 60 FPS WebSocket Server
  pitwall-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pitwall-web
    expose:
      - "8000"
    environment:
      - PYTHONPATH=/app/src
      - ALLOWED_ORIGINS=https://pitwall-f1.live,https://www.pitwall-f1.live,http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - ./.cache:/app/.cache
    restart: unless-stopped

  # Nginx Reverse Proxy with TLS/SSL & WebSocket Upgrades
  nginx:
    image: nginx:alpine
    container_name: pitwall-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - pitwall-web
    restart: unless-stopped
