services:
  # FastAPI Web App & 60 FPS WebSocket Server
  pitwall-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pitwall-web
    expose:
      - "8000"
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./.cache:/app/.cache
    restart: unless-stopped

  # Nginx Reverse Proxy for WebSocket Upgrades & Future TLS Termination
  nginx:
    image: nginx:alpine
    container_name: pitwall-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pitwall-web
    restart: unless-stopped
