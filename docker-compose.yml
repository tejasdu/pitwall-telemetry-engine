services:
  # 1. Redis 7 Stream Buffer (f1:telemetry:raw)
  redis:
    image: redis:7-alpine
    container_name: pitwall-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 2. FastAPI Web App & 60 FPS WebSocket Server
  pitwall-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pitwall-web
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  redis_data:
