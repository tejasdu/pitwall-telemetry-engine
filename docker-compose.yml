services:
  # FastAPI Web App & 60 FPS WebSocket Server
  pitwall-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pitwall-web
    expose:
      - "8000"
    environment:
      - PYTHONPATH=/app/src
      - ALLOWED_ORIGINS=https://pitwall-f1.live,https://www.pitwall-f1.live,http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - ./.cache:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped


  # Nginx Reverse Proxy with TLS/SSL & WebSocket Upgrades
  nginx:
    image: nginx:alpine
    container_name: pitwall-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - pitwall-web
    restart: unless-stopped
