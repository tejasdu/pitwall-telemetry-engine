events {
    worker_connections 1024;
}

http {
    # Rate limiting: 40 requests/sec per IP with burst allowance of 60
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=40r/s;

    # 1. HTTP Server: Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name pitwall-f1.live www.pitwall-f1.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server: SSL Termination + WebSocket Streaming
    server {
        listen 443 ssl;
        server_name pitwall-f1.live www.pitwall-f1.live;

        ssl_certificate /etc/letsencrypt/live/pitwall-f1.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pitwall-f1.live/privkey.pem;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Proxy all standard HTTP traffic to FastAPI
        location / {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://pitwall-web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Handle WebSocket upgrades specifically for 60 FPS live telemetry
        location /api/ws/ {
            proxy_pass http://pitwall-web:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            
            # Disable buffering for real-time 60 FPS streaming
            proxy_buffering off;

            # Keep WebSocket connections alive
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
