events {
    worker_connections 1024;
}

http {
    # Rate limiting: 40 requests/sec per IP with burst allowance of 60
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=40r/s;

    server {
        listen 80;
        
        # Proxy all standard HTTP traffic to the FastAPI app with rate limiting
        location / {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://pitwall-web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle WebSocket upgrades specifically for the telemetry stream
        location /api/ws/ {
            proxy_pass http://pitwall-web:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            
            # Disable buffering for real-time 60 FPS streaming
            proxy_buffering off;

            # Keep WebSocket connections alive
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
