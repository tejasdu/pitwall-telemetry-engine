[project]
name = "pitwall-telemetry-engine"
version = "0.1.0"
description = "Real-time F1 Telemetry & Inference Engine"
readme = "README.md"
authors = [
    { name = "tejasdu", email = "tejasdu@umich.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "prometheus-client>=0.20.0",
    "requests",
    "pandas",
    "redis>=5.0.0",
]

[project.scripts]
pitwall-telemetry-engine = "pitwall_telemetry_engine.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
