[project]
name = "pitwall-telemetry-engine"
version = "0.2.0"
description = "Real-time F1 Telemetry, Inferences & 60 FPS WebSocket Pitwall Engine"
readme = "README.md"
authors = [
    { name = "tejasdu", email = "tejasdu@umich.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "pandas",
]

[project.scripts]
pitwall-telemetry-engine = "pitwall_telemetry_engine.api.app:start"
pitwall-web = "pitwall_telemetry_engine.api.app:start"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

